services:
  business-card-api:
    build: .
    image: business_card_api:dev
    env_file:
      - .env
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 60s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped